<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>فرزندان ایران — یادبود جانباختگان ۱۸ و ۱۹ دی ۱۴۰۴</title>
<meta name="description" content="یادبودی برای ثبت و زنده‌نگه‌داشتن نام جانباختگان ۱۸ و ۱۹ دی ۱۴۰۴؛ نقشه‌ی تعاملی استان‌های ایران." />
<meta property="og:title" content="فرزندان ایران — یادبود جانباختگان ۱۸ و ۱۹ دی ۱۴۰۴" />
<meta property="og:description" content="هر نام، یک زندگی. هر نور، یک یاد." />
<meta property="og:type" content="website" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="fog fog-a" aria-hidden="true"></div>
<div class="fog fog-b" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">فرزندان ایران</div>
  <div class="topbar-actions">
    <div class="search-box">
      <input id="search" type="text" placeholder="جست‌وجوی نام، شهر یا استان…" autocomplete="off" />
      <div id="searchResults" class="search-results hidden"></div>
    </div>
    <button id="btnSound" class="btn" title="صدای یادبود" aria-label="خاموش/روشن کردن صدای یادبود">🔊</button>
    <button id="btnShare" class="btn ghost">اشتراک‌گذاری</button>
  </div>
</header>

<section class="hero">
  <h1 class="hero-title">به یادِ <span class="accent">فرزندان ایران</span></h1>
  <p class="hero-sub">هر نام، یک زندگی. هر نور، یک یاد.</p>
  <p class="hero-date">جان‌باختگان ۱۸ و ۱۹ دی ۱۴۰۴</p>
  <div class="hero-count">
    <span class="num" id="totalCount">۰</span>
    <span class="lbl">نامِ مستند تاکنون — فهرست در حال تکمیل</span>
  </div>
</section>

<section class="map-section">
  <div id="mapWrap">
    <div id="map2dWrap" aria-label="نقشه ایران"></div>
    <div id="tooltip" class="hidden"></div>
  </div>
  <p class="map-hint">برای دیدن فهرست نام‌ها، روی استان کلیک کنید</p>
</section>

<footer class="footer">
  <p class="footer-note" id="footerNote"></p>
  <p class="footer-tag">«فرزندان ایران» — برای زنده نگه‌داشتن نام‌ها</p>
</footer>

<!-- پنجره‌ی استان -->
<div id="modal" class="modal" aria-hidden="true">
  <div class="modal-backdrop" data-close="modal"></div>
  <div class="modal-dialog" role="dialog" aria-modal="true">
    <button class="modal-close" data-close="modal" aria-label="بستن">✕</button>
    <header class="modal-head">
      <h2 class="modal-province" id="modalProvince"></h2>
      <div class="modal-count" id="modalCount"></div>
    </header>
    <div class="modal-search">
      <input id="modalSearch" type="text" placeholder="جست‌وجو در این استان…" autocomplete="off" />
    </div>
    <div class="modal-list" id="modalList"></div>
  </div>
</div>

<!-- پنجره‌ی جزئیات یک نام -->
<div id="detail" class="modal" aria-hidden="true">
  <div class="modal-backdrop" data-close="detail"></div>
  <div class="detail-dialog" role="dialog" aria-modal="true">
    <button class="modal-close" data-close="detail" aria-label="بستن">✕</button>
    <div class="detail-layout">
      <aside class="detail-side">
        <div class="detail-photo" id="detailPhoto"></div>
        <div id="detailMedia" class="detail-media hidden"></div>
      </aside>
      <div class="detail-main">
        <h3 class="detail-name" id="detailName"></h3>
        <div class="detail-meta" id="detailMeta"></div>
        <div class="detail-info" id="detailInfo"></div>
        <div class="detail-divider"></div>
        <p class="detail-note" id="detailNote"></p>
        <div class="detail-src" id="detailSrc"></div>
        <p class="detail-tribute">یادش گرامی 🕊</p>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="data/iranMap.js"></script>
<script src="data/victims.js"></script>
<script src="js/app.js"></script>
</body>
</html>
